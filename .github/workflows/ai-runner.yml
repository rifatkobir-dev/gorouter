name: GoRouter AI Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Run AI with curl
        env:
          GOROUTER_API_KEY: ${{ secrets.GOROUTER_API_KEY }}
        run: |
          curl -s -X POST https://gorouter.app/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GOROUTER_API_KEY" \
            -A "curl/7.88.1" \
            -d '{
              "model": "claude-opus-5-thinking",
              "messages": [{"role": "user", "content": "Say hello in one sentence."}]
            }'
