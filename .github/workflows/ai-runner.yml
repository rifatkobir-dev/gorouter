name: GoRouter AI Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run AI Script
        env:
          GOROUTER_API_KEY: ${{ secrets.GOROUTER_API_KEY }}
        run: python ai_script.py
